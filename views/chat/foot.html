    function userId() {

    function aiRequest(path, options) {
        options = options || {};
        options.headers = options.headers || {};
        options.headers["Authorization"] = "Bearer " + authToken();
        if (options.body) {
            options.headers["Content-Type"] = "application/json";
        }
        return fetch(path, options).then(function (response) {
            return response.json().then(function (body) {
                if (!response.ok || body.code !== 0) {
                    throw new Error(body.message || "请求失败");
                }
                return body.data;
            });
        });
    }

                loadAIData: function () {
                    Promise.all([
                        aiRequest("/api/ai/templates"),
                        aiRequest("/api/ai/characters"),
                        aiRequest("/api/ai/conversations")
                    ]).then(function (results) {
                        this.aiTemplates = results[0] || [];
                        this.aiCharacters = this.uniqueAICharacters(results[1] || []);
                        this.aiConversations = this.uniqueAIConversations(results[2] || []);
                    }.bind(this)).catch(function (error) {
                        console.log("load ai data", error);
                    });

                showAICharacterForm: function () {
                    this.aiCharacterForm = {
                        templateId: null, name: "", relationType: "", traits: "", hobbies: "",
                        speakingStyle: "", background: "", avatar: "", systemPrompt: ""
                    };
                    this.win = "ai-character-form";

                chooseAITemplate: function (template) {
                    this.aiCharacterForm.templateId = template.ID;
                    this.aiCharacterForm.name = template.name;
                    this.aiCharacterForm.relationType = template.relationType;
                    this.aiCharacterForm.avatar = template.avatar || "";
                    this.aiCharacterForm.systemPrompt = template.defaultPrompt || "";
                },
                createAICharacter: function () {
                    if (this.aiSaving) {
                        return;
                    }
                    if (!this.aiCharacterForm.name.trim() || !this.aiCharacterForm.relationType.trim()) {
                        mui.toast("请填写角色名字和关系");
                        return;
                    }
                    this.aiSaving = true;
                    aiRequest("/api/ai/characters", {
                        method: "POST",
                        body: JSON.stringify(this.aiCharacterForm)
                    }).then(function (character) {
                        this.aiCharacters = this.uniqueAICharacters([character].concat(this.aiCharacters));
                        return this.startAIConversation(character);
                    }.bind(this)).catch(function (error) {
                        mui.toast(error.message);
                    }).finally(function () {
                        this.aiSaving = false;
                    }.bind(this));
                },
                startAIConversation: function (character) {
                    var existing = this.aiConversations.find(function (conversation) {
                        return conversation.characterId === character.ID;
                    });
                    if (existing) {
                        return this.openAIConversation(existing);
                    }
                    if (this.aiStartingCharacterId === character.ID) {
                        return Promise.resolve();
                    }
                    this.aiStartingCharacterId = character.ID;
                    return aiRequest("/api/ai/conversations", {
                        method: "POST",
                        body: JSON.stringify({ characterId: character.ID })
                    }).then(function (conversation) {
                        this.aiConversations = this.uniqueAIConversations([conversation].concat(this.aiConversations));
                        return this.openAIConversation(conversation);
                    }.bind(this)).catch(function (error) {
                        mui.toast(error.message);
                    }).finally(function () {
                        this.aiStartingCharacterId = 0;
                    }.bind(this));
                },
                uniqueAICharacters: function (characters) {
                    var seen = {};
                    return characters.filter(function (character) {
                        var key = [character.name, character.relationType].join("\u0000");
                        if (seen[key]) {
                            return false;
                        }
                        seen[key] = true;
                        return true;
                    });
                },
                uniqueAIConversations: function (conversations) {
                    var seen = {};
                    return conversations.filter(function (conversation) {
                        var key = String(conversation.characterId);
                        if (seen[key]) {
                            return false;
                        }
                        seen[key] = true;
                        return true;
                    });
                },
                openAIConversation: function (conversation) {
                    this.aiCurrentConversation = conversation;
                    this.aiCurrentAvatar = this.aiConversationAvatar(conversation);
                    this.aiMessages = [];
                    this.aiText = "";
                    this.win = "ai-chat";
                    return this.loadAIMessages();
                },
                loadAIMessages: function () {
                    return aiRequest("/api/ai/conversations/" + this.aiCurrentConversation.ID + "/messages?limit=100")
                        .then(function (messages) {
                            this.aiMessages = messages || [];
                            this.scrollAIChat();
                        }.bind(this))
                        .catch(function (error) {
                            mui.toast(error.message);
                        });
                },
                reloadAIMessages: function () {
                    if (this.aiRefreshing || !this.aiCurrentConversation.ID) {
                        return;
                    }
                    this.aiRefreshing = true;
                    return this.loadAIMessages().finally(function () {
                        this.aiRefreshing = false;
                    }.bind(this));
                },
                aiConversationSnapshot: function (conversation) {
                    try {
                        return JSON.parse(conversation.characterSnapshot || "{}");
                    } catch (error) {
                        return {};
                    }
                },
                aiConversationAvatar: function (conversation) {
                    return this.aiConversationSnapshot(conversation).avatar || "/asset/images/avatar0.png";
                },
                aiConversationSubtitle: function (conversation) {
                    var snapshot = this.aiConversationSnapshot(conversation);
                    return snapshot.traits || snapshot.relationType || "AI 角色";
                },
                sendAIText: function () {
                    var content = this.aiText.trim();
                    if (!content || this.aiSending || !this.aiCurrentConversation.ID) {
                        return;
                    }
                    this.aiText = "";
                    this.aiSending = true;
                    this.aiMessages.push({ role: "user", content: content, status: "completed" });
                    var pending = { role: "assistant", content: "", status: "pending" };
                    this.aiMessages.push(pending);
                    this.scrollAIChat();
                    aiRequest("/api/ai/conversations/" + this.aiCurrentConversation.ID + "/messages", {
                        method: "POST",
                        body: JSON.stringify({ content: content })
                    }).then(function (message) {
                        Object.assign(pending, message);
                        this.scrollAIChat();
                    }.bind(this)).catch(function (error) {
                        pending.status = "failed";
                        mui.toast(error.message);
                        this.loadAIMessages();
                    }.bind(this)).finally(function () {
                        this.aiSending = false;
                    }.bind(this));
                },

                startrecorder: function () {
                    let audioTarget = document.getElementById('audio');
                    var types = ["video/webm",
                        "audio/webm",
                        "video/webm\;codecs=vp8",
                        "video/webm\;codecs=daala",
                        "video/webm\;codecs=h264",
                        "audio/webm\;codecs=opus",
                        "video/mpeg"];
                    var suporttype = "";
                    for (var i in types) {
                        if (MediaRecorder.isTypeSupported(types[i])) {
                            suporttype = types[i];
                        }
                    }
                    if (!suporttype) {
                        mui.toast("编码不支持")
                        return;
                    }

                    this.duration = new Date().getTime();
                    //video 摄像头   ，audio 音频
                    navigator.mediaDevices.getUserMedia({ audio: true, video: false })
                        .then(function (stream) {
                            this.showprocess = true
                            this.recorder = new MediaRecorder(stream);
                            audioTarget.srcObject = stream;
                            //是否可用
                            this.recorder.ondataavailable = (event) => {
                                console.log("ondataavailable");
                                uploadblob("attach/upload", event.data, ".mp3", res => {
                                    var duration = Math.ceil((new Date().getTime() - this.duration) / 1000);
                                    this.sendaudiomsg(res.data, duration);
                                })
                                stream.getTracks().forEach(function (track) {
                                    track.stop();
                                });
                                this.showprocess = false
                            }
                            this.recorder.start();
                        }.bind(this)).
                        catch(function (err) {
                            console.log(err)
                            mui.toast(err)
                            this.showprocess = false
                        }.bind(this));
                },
                stoprecorder: function () {
                    if (typeof this.recorder.stop == "function") {
                        this.recorder.stop();
                    }
                    this.showprocess = false
                    console.log("stoprecorder")

                },

                loaddoutures: function () {
                    var res = [];
                    var config = this.doutu.config;
                    for (var i in config.pkgids) {
                        res[config.pkgids[i]] = (config.baseurl + "/" + config.pkgids[i] + "/info.json")
                    }
                    var that = this;
                    for (var id in res) {
                        this.$http.get(res[id]).then(response => {
                            pkginfo = response.data
                            var baseurl = config.baseurl + "/" + pkginfo.id + "/"
                            // console.log("post res[i]",id,res[id],pkginfo)
                            for (var j in pkginfo.assets) {
                                pkginfo.assets[j] = baseurl + pkginfo.assets[j];
                            }
                            pkginfo.icon = baseurl + pkginfo.icon;
                            that.doutu.packages.push(pkginfo)
                            if (that.doutu.choosed.pkgid == pkginfo.id) {
                                that.doutu.choosed.assets = pkginfo.assets;
                            }

                        })
                    }
                },
                showmsg: function (user, msg, isReverse, isFirst) {
                    //console.log(">>>>>>>>>>>", user)
                    // console.log(">>>>>>>>>>>", msg)
                    var data = {
                    }
                    data.ismine = userId() == msg.userId;
                    //console.log(data.ismine,userId(),msg.userid)
                    data.user = user;
                    data.msg = msg;
                    console.log(this.msglist)
                    if (isReverse) {
                        this.msglist = [data].concat(this.msglist);
                    } else {
                        //首次获取消息渲染
                        if (isFirst) {
                            this.msglist = [data].concat(this.msglist);
                            //下拉获取消息渲染
                        } else {
                            this.msglist = this.msglist.concat(data)
                        }
                    }
                    this.reset();
                    var that = this;
                    that.timer = setTimeout(function () {
                        window.scrollTo(0, document.getElementById("convo").offsetHeight);
                        if (!isReverse) {
                            let scroll = document.querySelector("#convo .mui-scroll-wrapper").offsetHeight;
                            let inner = document.querySelector("#convo .mui-scroll").offsetHeight;
                            let y = scroll - inner - 80;
                            let transform = document.querySelector("#convo .mui-scroll").style.transform;
                            document.querySelector("#convo .mui-scroll").style.transform = 'translateY(' + y + 'px)';
                        } else {
                            document.querySelector("#convo .mui-scroll").style.transform = 'translateY(' + 0 + 'px)';
                        }



                        clearTimeout(that.timer)
                    }, 100)
                },

                singlemsg: function (user) {
                    this.start = 0;
                    this.end = 9;
                    if (this.isDisable) {
                        //首次读取某个用户的消息记录
                        if (this.isReadRedisMsg.filter(item => item === user.ID).length <= 0) {
                            post("user/redisMsg", { userIdA: userId(), userIdB: user.ID, start: this.start, end: this.end, isRev: false }, function (res) {
                                //循环读取的消息记录 并显示
                                for (var i in res.total) {
                                    this.showmsg(user, JSON.parse(res.total[i]), false, true)
                                }
                            }.bind(this))
                            this.isReadRedisMsg.push(user.ID)
                        }

                        this.setTimeFlag()
                        //console.log(user)
                        this.win = "single";
                        this.title = "和" + user.Name + "聊天中";
                        this.otherAvatar = user.Avatar;
                        this.msgcontext.TargetId = parseInt(user.ID);
                        this.msgcontext.Type = 1;
                        mui('.mui-scroll-wrapper').scroll({
                            scrollY: true, //是否竖向滚动
                            scrollX: false, //是否横向滚动
                            startX: 0, //初始化时滚动至x
                            startY: 0, //初始化时滚动至y
                            indicators: true, //是否显示滚动条
                            deceleration: 0.0006, //阻尼系数,系数越小滑动越灵敏
                            bounce: true //是否启用回弹
                        });
                        //下拉获取历史消息记录
                        document.querySelector('.mui-scroll-wrapper').addEventListener('scroll', (e) => {
                            let translate = e.target.style?.transform?.match(/translate3d\(\d+px,\s*(\d+)px,\s*(\d+)px\)/i);
                            if (translate && translate.length > 1) {
                                if (translate[1] > 0 && this.isLoadMore == false) {
                                    this.isLoadMore = true;
                                    this.start = this.end + 1;
                                    this.end = this.end + 2;
                                    post("user/redisMsg", { userIdA: userId(), userIdB: user.ID, start: this.start, end: this.end, isRev: false }, function (res) {
                                        //循环读取的消息记录 并显示
                                        for (var i in res.total) {
                                            this.showmsg(user, JSON.parse(res.total[i]), true)
                                        }
                                        setTimeout(() => {
                                            this.isLoadMore = false;
                                        }, 300);
                                    }.bind(this))
                                    this.isReadRedisMsg.push(user.ID)
                                }
                            }
                        })
                    }
                },

                    userid = "" + userid;

                    var userinfo = this.usermap[userid];
                    if (!userinfo) {
                        post("user/find", { userId: parseInt(userid) }, function (res) {

                        }.bind(this))
                    } else {

                                // 1文字 2表情包 3图片 4音频
                                if (data.Media === 1) {

                                } else if (data.Media === 2) {

                        console.log("onmessage", evt.data)

                        } else {

                        }

                                mui.toast("添加成功");
                                that.loadfriends();
                            } else {
                                mui.toast(res.message);
                            }
                        })
                    }
                },
                //个人资料修改显示
                setUserInfo: function () {
                    this.win = "userinfo"
                    //  console.log("createCom")
                },
                //新建群显示
                createCom: function () {
                    this.win = "community"
                    //  console.log("createCom")
                },

                //新建群提交
                createcommunity() {
                    //console.log("createcommunity")
                    this.com.ownerId = userId()
                    console.log(this.com)
                    util.post("/contact/createCommunity", this.com).then(res => {
                        console.log(res)
                        if (res.code != 0) {
                            mui.toast(res.message)
                        } else {
                            //location.replace("localhost:8081")
                            //location.href = "/"
                            mui.toast("建群成功")
                            this.loadcommunitys();
                            //goBack()
                        }
                    })
                },
                updateUserInfo() {
                    //console.log("createcommunity")
                    this.info.id = userId()
                    util.post("/user/updateUser", this.info).then(res => {
                        console.log(res)
                        let userInfo = JSON.parse(sessionStorage.getItem('userinfo') || '{}');
                        userInfo.Avatar = this.info.icon;
                        userInfo.Name = this.info.name;
                        sessionStorage.setItem('userinfo', JSON.stringify(userInfo))
                        if (res.code != 0) {
                            mui.toast(res.message)
                        } else {
                            //location.replace("localhost:8081")
                            //location.href = "/"
                            mui.toast("修改成功")
                            //goBack()
                        }
                    })
                },



                //回到聊天首页
                goBack() {
                    this.win = "main"
                },

                _joincomunity: function (dstobj) {
                    if (this.isDisable) {
                        this.setTimeFlag();
                        var that = this;
                        console.log(that);
                        post("contact/joinGroup", { comId: dstobj, "userId": userId() }, function (res) {
                            if (res.code == 0) {
                                mui.toast("添加成功");

                                that.loadcommunitys();
                            } else {
                                mui.toast(res.message);
                            }
                        })
                    }
                },
                joincom: function () {
                    var that = this;
                    mui.prompt('', '请输入群号或者群名称', '加群', ['取消', '确认'], function (e) {
                        if (e.index == 1) {
                            //    if (isNaN(e.value) || e.value <= 0) {
                            //       mui.toast('格式错误');
                            //   } else {
                            //mui.toast(e.value);
                            that._joincomunity(e.value)
                            // }
                        } else {
                            //mui.toast('您取消了入库');
                        }
                    }, 'div');
                    document.querySelector('.mui-popup-input input').type = 'text';
                },
                quit: function () {
                    sessionStorage.removeItem("userid")
                    sessionStorage.removeItem("userinfo")
                    location.href = "/"
                },
                setTimeFlag() {
                    this.isDisable = false;
                    setTimeout(() => {
                        this.isDisable = true;
                    }, 100)
                },
                heartbeat() {
                    if (this.webSocket.readyState == 1) {  //失去连接 3
                        var msg = this.createmsgcontext();
                        msg.Media = -1;
                        msg.Type = 3
                        msg.Content = "心跳";
                        //this.showmsg(userInfo(),msg);
                        this.webSocket.send(JSON.stringify(msg))
                    }

                }


            },
            watch: {
                "win": function (n, o) {
                    // console.log("watch",o,n)
                    if (n != "main") {
                        document.getElementById("menubar").style.display = "none";
                    } else {
                        document.getElementById("menubar").style.display = "block";
                    }
                }
            }
        }
    )

</script>
