mysql:
  dsn: ""
redis:
  addr: "127.0.0.1:6379"
  password: ""
  DB: 0
  poolSize: 30
  minIdleConn: 30
server:
  port: ":8081"
udp:
  enabled: false
  host: "127.0.0.1"
  port: 3001
ai:
  provider: "openrouter"
  baseURL: "https://openrouter.ai/api/v1"
  apiKey: ""
  model: "openai/gpt-oss-120b:free"
  httpReferer: ""
  appTitle: "goChat"
  timeoutSeconds: 60
  historyLimit: 20
  maxInputCharacters: 4000
  maxOutputTokens: 800
  temperature: 0.8
  dailyMessageLimit: 100

timeout:
  DelayHeartbeat: 3   #延迟心跳时间  单位秒
  HeartbeatHz: 30   #每隔多少秒心跳时间
  HeartbeatMaxTime: 30000  #最大心跳时间  ，超过此就下线
  RedisOnlineTime: 4  #缓存的在线用户时长   单位H
